<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" preserveAspectRatio="none">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="3" y="3" width="394" height="219" fill="rgba(15,23,42,0.5)" stroke="url(#flow)" stroke-width="2" filter="url(#glow)"/>
  <rect x="8" y="8" width="384" height="209" fill="none" stroke="url(#flow)" stroke-width="1" opacity="0.5"/>
  <text x="200" y="118" text-anchor="middle" fill="#a855f7" font-size="14" font-family="sans-serif" opacity="0.7">FLOW BORDER</text>
</svg>